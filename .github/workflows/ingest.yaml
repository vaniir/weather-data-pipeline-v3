name: Weather Data Ingestion

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore environment variables
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_CONTENT" > .env

      - name: Validate environment configuration
        run: |
          python - <<'PY'
          from config import settings

          required = [
              "SNOWFLAKE_ACCOUNT",
              "SNOWFLAKE_USER",
              "SNOWFLAKE_PASSWORD",
              "SNOWFLAKE_WAREHOUSE",
              "SNOWFLAKE_DATABASE",
              "SNOWFLAKE_SCHEMA",
              "OPENWEATHER_KEY",
              "WEATHERAPI_KEY",
          ]

          missing = [name for name in required if not getattr(settings, name, None)]

          if missing:
              raise RuntimeError(f"Missing environment settings: {', '.join(missing)}")

          print("All required environment settings are present.")
          PY

      - name: Run ingestion pipeline
        run: python -m Orchestration.flow